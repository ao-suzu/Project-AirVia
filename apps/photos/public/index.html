<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>写真共有 - AirVia</title>
    <style>
        :root {
            --bg-page: #f8f9fa;
            --surface: #ffffff;
            --surface-variant: #f1f3f5;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-tertiary: #8c959f;
            --border: #d0d7de;
            --border-subtle: #eaeef2;
            --primary: #0969da;
            --primary-hover: #085bc4;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            background: var(--surface-variant);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background-color 0.15s;
        }

        .btn-back:active {
            background: #e2e5e9;
        }

        .page-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .count-badge {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        main {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
        }

        /* Upload Trigger Bar */
        .upload-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .upload-bar:hover, .upload-bar.dragover {
            border-color: var(--primary);
            background: #f6f8fa;
        }

        .upload-text {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }

        .upload-text svg {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
        }

        .btn-add {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            pointer-events: none;
        }

        #file-input {
            display: none;
        }

        /* Progress Bar */
        .progress-bar-container {
            display: none;
            background: var(--border-subtle);
            border-radius: 9999px;
            height: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.2s ease;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }

        @media (min-width: 600px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
        }

        .photo-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .photo-card:active {
            opacity: 0.85;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-meta {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
            padding: 6px 8px;
            font-size: 11px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 16px;
            color: var(--text-secondary);
        }

        .empty-icon {
            margin-bottom: 12px;
            color: var(--text-tertiary);
        }

        .empty-icon svg {
            width: 44px;
            height: 44px;
            fill: currentColor;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: var(--radius-sm);
            object-fit: contain;
        }

        .lightbox-actions {
            margin-top: 16px;
        }

        .btn-download {
            background: #ffffff;
            color: #1f2328;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="btn-back" id="photos-back">戻る</a>
                <h1 class="page-title">写真共有</h1>
            </div>
            <div class="count-badge" id="photo-count">0 枚</div>
        </div>
    </header>

    <main>
        <div class="upload-bar" id="dropzone" onclick="document.getElementById('file-input').click()">
            <div class="upload-text">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span>写真を追加</span>
            </div>
            <button class="btn-add">選択</button>
            <input type="file" id="file-input" multiple accept="image/*,video/*">
        </div>

        <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>

        <div id="gallery-container">
            <div class="gallery-grid" id="gallery-grid"></div>
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/></svg>
                </div>
                <p>写真がまだありません</p>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightbox-img" src="" alt="preview">
        <div class="lightbox-actions">
            <a id="lightbox-dl" class="btn-download" href="" download>保存する</a>
        </div>
    </div>

    <script>
        // 戻り先制御（ホストPCなら管理画面、ゲストならポータル）
        const isHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || new URLSearchParams(window.location.search).get('from') === 'admin' || document.referrer.includes('/admin');
        const backLink = document.getElementById('photos-back');
        if (backLink) {
            if (isHost) {
                backLink.href = '/admin';
                backLink.textContent = '管理画面へ';
            } else {
                backLink.href = '/';
                backLink.textContent = 'ポータルへ';
            }
        }

        const fileInput = document.getElementById('file-input');
        const dropzone = document.getElementById('dropzone');
        const galleryGrid = document.getElementById('gallery-grid');
        const emptyState = document.getElementById('empty-state');
        const photoCount = document.getElementById('photo-count');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxDl = document.getElementById('lightbox-dl');

        ['dragenter', 'dragover'].forEach(name => {
            dropzone.addEventListener(name, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(name => {
            dropzone.addEventListener(name, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            });
        });

        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        function handleFiles(files) {
            if (!files || files.length === 0) return;

            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('photos', files[i]);
            }

            uploadPhotos(formData);
        }

        function uploadPhotos(formData) {
            progressContainer.style.display = 'block';
            progressBar.style.width = '30%';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/apps/photos/api/upload', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = `${percent}%`;
                }
            };

            xhr.onload = () => {
                progressBar.style.width = '100%';
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    progressBar.style.width = '0%';
                }, 300);

                if (xhr.status === 200) {
                    loadPhotos();
                } else {
                    alert('アップロードに失敗しました');
                }
                fileInput.value = '';
            };

            xhr.onerror = () => {
                progressContainer.style.display = 'none';
                alert('アップロード中にエラーが発生しました');
            };

            xhr.send(formData);
        }

        async function loadPhotos() {
            try {
                const res = await fetch('/apps/photos/api/list');
                const data = await res.json();
                if (data.success) {
                    renderGallery(data.photos);
                }
            } catch (err) {
                console.error(err);
            }
        }

        let renderedPhotoSignatures = '';

        function renderGallery(photos) {
            photoCount.textContent = `${photos.length} 枚`;

            if (photos.length === 0) {
                emptyState.style.display = 'block';
                galleryGrid.innerHTML = '';
                renderedPhotoSignatures = '';
                return;
            }

            // 写真一覧のシグネチャを比較し、変更がなければDOM再生成をスキップ（チラつきと負荷の防止）
            const currentSignatures = photos.map(p => `${p.filename}_${p.size}`).join('|');
            if (currentSignatures === renderedPhotoSignatures) {
                return;
            }
            renderedPhotoSignatures = currentSignatures;

            emptyState.style.display = 'none';
            galleryGrid.innerHTML = '';

            photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.onclick = () => openLightbox(photo.url);

                const img = document.createElement('img');
                img.src = photo.url;
                img.loading = 'lazy';
                img.decoding = 'async';
                img.alt = photo.filename;

                const meta = document.createElement('div');
                meta.className = 'photo-meta';
                const date = new Date(photo.createdAt);
                meta.innerHTML = `<span>${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}</span><span>${formatBytes(photo.size)}</span>`;

                card.appendChild(img);
                card.appendChild(meta);
                galleryGrid.appendChild(card);
            });
        }

        function openLightbox(url) {
            lightboxImg.src = url;
            lightboxDl.href = url;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxImg.src = '';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        loadPhotos();
        setInterval(loadPhotos, 5000);
    </script>
</body>
</html>
